<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOOM — Dashboard Aesthetic Gallery</title>
<meta name="description" content="BLOOM is a gallery of single-file, dependency-free HTML/CSS dashboard aesthetics — browse a range of visual styles and pick one to start your own personal dashboard.">
<meta property="og:title" content="BLOOM — Dashboard Aesthetic Gallery">
<meta property="og:description" content="Browse a gallery of single-file, dependency-free HTML/CSS dashboard aesthetics and pick a style to start your own personal dashboard.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23e8b36a%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23e8916f%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2228%22%20fill%3D%22url%28%23g%29%22%2F%3E%3C%2Fsvg%3E">
<style>
  /* Self-hosted Inter (variable font, latin subset) — no network dependency. */
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('fonts/inter-normal.woff2') format('woff2');
  }
  :root {
    --bg-1: #f9f1e6;
    --bg-2: #eeddc9;
    --card: #f2e8db;
    --shadow-light: rgba(255, 255, 255, 0.9);
    --shadow-dark: rgba(180, 142, 101, 0.38);
    --coral: #e8916f;
    --gold: #e8b36a;
    --text-dark: #5b4636;
    --text-muted: #726250;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 15% 10%, #fdf6ec 0%, var(--bg-1) 35%, var(--bg-2) 100%);
    color: var(--text-dark);
    min-height: 100vh;
    padding: 64px 24px 96px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 56px; }
  header .eyebrow {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--coral);
    margin-bottom: 12px;
  }
  header h1 {
    font-size: 42px;
    font-weight: 800;
    margin: 0 0 14px;
  }
  header p {
    color: var(--text-muted);
    font-size: 16px;
    max-width: 520px;
    margin: 0 auto;
    line-height: 1.6;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 28px;
  }
  .tile {
    background: var(--card);
    border: 1px solid #8c6e50;
    border-radius: 28px;
    padding: 28px;
    text-decoration: none;
    color: var(--text-dark);
    box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
    transition: transform 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .tile:hover { transform: translateY(-4px); }
  .tile:focus-visible {
    outline: 2px solid var(--coral);
    outline-offset: 3px;
  }
  .preview {
    height: 140px;
    border-radius: 20px;
    background: linear-gradient(145deg, #f6efe4, #eeddc9);
    box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .preview .orb {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--gold), var(--coral));
    box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
  }
  .preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: inherit;
  }
  .tile h2 { font-size: 18px; margin: 0; font-weight: 700; }
  .tile p { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.5; }
  .tile .tag {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--coral);
  }
  .tile.soon {
    opacity: 0.55;
    pointer-events: none;
  }
  .tile.soon .preview { background: repeating-linear-gradient(45deg, #ede2d3, #ede2d3 10px, #e9dcc9 10px, #e9dcc9 20px); box-shadow: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.001ms !important;
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow">BLOOM</div>
      <h1>Pick a dashboard aesthetic</h1>
      <p>A small gallery of single-file, dependency-free HTML/CSS dashboards. Explore a style, open it, keep it — everything runs fully offline.</p>
    </header>

    <div class="grid" id="gallery"></div>
  </div>

  <script>
    // Add an entry here to register a new dashboard style in the gallery.
    // See README.md ("Adding a new dashboard style") for the full convention.
    const DASHBOARDS = [
      {
        title: "3D Dashboard",
        tag: "5 designs",
        desc: "Soft, pillowy, dimensional materials — warm neumorphic, deep space console, holographic, brushed metal, gummy toy.",
        href: "dashboards/3d-dashboard/index.html",
        status: "live",
        preview: "dashboards/3d-dashboard/previews/warm-neumorphic.png",
      },
      {
        title: "Glassmorphic",
        tag: "5 designs",
        desc: "Frosted, translucent layers over gradient backdrops — daylight, obsidian, aurora, amber, and frost glass.",
        href: "dashboards/glassmorphic/index.html",
        status: "live",
        preview: "dashboards/glassmorphic/previews/daylight-glass.png",
      },
      {
        title: "Editorial Minimal",
        tag: "5 designs",
        desc: "Typographic, high-contrast, print-inspired layouts — Swiss grid, broadsheet, brutalist, runway, ledger.",
        href: "dashboards/editorial-minimal/index.html",
        status: "live",
        preview: "dashboards/editorial-minimal/previews/swiss-grid.png",
      },
    ];

    function renderPreview(dashboard) {
      if (dashboard.preview) {
        return `<div class="preview"><img src="${dashboard.preview}" alt="${dashboard.title} preview" loading="lazy"></div>`;
      }
      if (dashboard.status === "live") {
        return `<div class="preview"><div class="orb"></div></div>`;
      }
      return `<div class="preview"></div>`;
    }

    function renderTile(dashboard) {
      const preview = renderPreview(dashboard);
      const body = `
        ${preview}
        <span class="tag">${dashboard.tag}</span>
        <h2>${dashboard.title}</h2>
        <p>${dashboard.desc}</p>
      `;

      if (dashboard.status === "live") {
        return `<a class="tile" href="${dashboard.href}">${body}</a>`;
      }
      return `<div class="tile soon">${body}</div>`;
    }

    document.getElementById("gallery").innerHTML = DASHBOARDS.map(renderTile).join("\n");
  </script>
</body>
</html>
