<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Dashboard — Pick a Design</title>
<meta name="description" content="The 3D Dashboard family from BLOOM — five dimensional, tactile reskins of one personal life-OS dashboard, each a single dependency-free HTML/CSS file.">
<meta property="og:title" content="3D Dashboard — Pick a Design">
<meta property="og:description" content="Five dimensional, tactile reskins of one personal life-OS dashboard — neumorphic, LED console, holographic, brushed metal, and gummy toy.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%25%22%20stop-color%3D%22%23e8b36a%22%2F%3E%3Cstop%20offset%3D%22100%25%22%20stop-color%3D%22%23e8916f%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2228%22%20fill%3D%22url%28%23g%29%22%2F%3E%3C%2Fsvg%3E">
<style>
  /* Self-hosted Inter (variable font, latin subset) — no network dependency. */
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('../../fonts/inter-normal.woff2') format('woff2');
  }
  :root {
    --bg-1: #f9f1e6;
    --bg-2: #eeddc9;
    --card: #f2e8db;
    --shadow-light: rgba(255, 255, 255, 0.9);
    --shadow-dark: rgba(180, 142, 101, 0.38);
    --coral: #e8916f;
    --gold: #e8b36a;
    --text-dark: #5b4636;
    --text-muted: #726250;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at 15% 10%, #fdf6ec 0%, var(--bg-1) 35%, var(--bg-2) 100%);
    color: var(--text-dark);
    min-height: 100vh;
    padding: 48px 24px 96px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .back-link {
    text-decoration: none; color: var(--text-muted);
    font-size: 13px; font-weight: 500; letter-spacing: 0.02em;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color 0.2s ease; margin-bottom: 40px;
  }
  .back-link:hover { color: var(--text-dark); }
  .back-link:focus-visible { outline: 2px solid var(--coral); outline-offset: 4px; border-radius: 4px; }
  header { text-align: center; margin-bottom: 56px; }
  header .eyebrow {
    font-size: 13px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--coral); margin-bottom: 12px;
  }
  header h1 { font-size: 42px; font-weight: 800; margin: 0 0 14px; }
  header p { color: var(--text-muted); font-size: 16px; max-width: 560px; margin: 0 auto; line-height: 1.6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 28px; }
  .tile {
    background: var(--card);
    border: 1px solid #8c6e50;
    border-radius: 28px;
    padding: 28px;
    text-decoration: none;
    color: var(--text-dark);
    box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
    transition: transform 0.2s ease;
    display: flex; flex-direction: column; gap: 18px;
  }
  .tile:hover { transform: translateY(-4px); }
  .tile:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }
  .preview {
    height: 150px; border-radius: 20px; overflow: hidden;
    background: linear-gradient(145deg, #f6efe4, #eeddc9);
    box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
    display: flex; align-items: center; justify-content: center;
  }
  .preview img { width: 100%; height: 100%; object-fit: cover; object-position: top center; border-radius: inherit; }
  .tile h2 { font-size: 18px; margin: 0; font-weight: 700; }
  .tile p { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.5; }
  .tile .tag {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--coral);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.001ms !important;
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
    }
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="../../index.html">&larr; All dashboards</a>
    <header>
      <div class="eyebrow">3D Dashboard</div>
      <h1>Pick a design</h1>
      <p>Five dimensional, tactile takes on the same personal life-OS dashboard — raised, molded, and hands-on. Same data, five very different materials. Everything runs fully offline.</p>
    </header>

    <div class="grid" id="gallery"></div>
  </div>

  <script>
    const DESIGNS = [
      {
        title: "Warm Neumorphic",
        tag: "Soft pillow",
        desc: "The original — soft, pillowy cream cards, warm gradients, and inset progress wells lit by ambient light.",
        href: "warm-neumorphic.html",
        preview: "previews/warm-neumorphic.png",
      },
      {
        title: "Deep Space Console",
        tag: "Backlit LEDs",
        desc: "Dark cockpit plastic where light comes from inside — glowing cyan LED insets and a dot-matrix habit telemetry grid.",
        href: "deep-space-console.html",
        preview: "previews/deep-space-console.png",
      },
      {
        title: "Holographic Iridescent",
        tag: "Soap-film sheen",
        desc: "Holo-sticker chromatics — conic rainbow sweeps and blend-mode sheens imply depth, and each habit streak shimmers a different hue.",
        href: "holographic-iridescent.html",
        preview: "previews/holographic-iridescent.png",
      },
      {
        title: "Brushed Metal Console",
        tag: "Anodized hardware",
        desc: "Hi-fi anodized aluminium — fine brushed striations, hard specular highlight bands, amber accents, and physical rocker toggles.",
        href: "brushed-metal.html",
        preview: "previews/brushed-metal.png",
      },
      {
        title: "Gummy Toy",
        tag: "Y2K jelly",
        desc: "Silicone jelly UI — glossy candy gumdrops with white specular blobs, thick squish borders, and colour-matched drop shadows.",
        href: "gummy-toy.html",
        preview: "previews/gummy-toy.png",
      },
    ];

    function renderTile(d) {
      return `<a class="tile" href="${d.href}">
        <div class="preview"><img src="${d.preview}" alt="${d.title} preview" loading="lazy"></div>
        <span class="tag">${d.tag}</span>
        <h2>${d.title}</h2>
        <p>${d.desc}</p>
      </a>`;
    }

    document.getElementById("gallery").innerHTML = DESIGNS.map(renderTile).join("\n");
  </script>
</body>
</html>
